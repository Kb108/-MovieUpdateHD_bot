services:
  - type: worker
    name: movie-update-hd-indexer
    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: python main.py

    envVars:
      - key: API_ID
        sync: false

      - key: API_HASH
        sync: false

      - key: SESSION_STRING
        sync: false

      - key: WORKER_URL
        sync: false

      - key: INDEX_SECRET
        sync: false

      - key: POLL_SECONDS
        value: "5"

      - key: RETRY_SECONDS
        value: "15"
